experiment:
  name: rtdetr_l
  family: Transformer
  model: rtdetr-l.pt
  description: Detector transformer en tiempo real, variante large.

training:
  # 30 para igualar el presupuesto del baseline YOLOv8n y de Faster R-CNN, así
  # la comparación no premia al modelo que entrenó más tiempo.
  epochs: 30
  imgsz: 640
  batch: 8
  patience: 10
  # AdamW y no `auto`: con `auto` Ultralytics descarta lr0 y elige el optimizador
  # y el learning rate por su cuenta (SGD a 0.01 con mas de 10000 iteraciones).
  # RT-DETR es un transformer y necesita AdamW alrededor de 1e-4.
  optimizer: AdamW
  lr0: 0.0001
  seed: 42

output:
  project: /content/drive/MyDrive/VCII_DFire/runs
  save_weights: true
